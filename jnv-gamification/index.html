<!DOCTYPE html>
<html lang="es" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>JNV Gamification — Entrenamiento</title>
  <meta name="description" content="Gamifica tu progreso de entrenamiento: niveles, bloques, tareas, puntos y rachas." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#10b981" />
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/logo.svg" />

  <!-- Tailwind (Play CDN) + config de modo oscuro por clase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: none; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    /* Transicion tipo movil al cambiar de vista */
    .vista-anim { animation: entradaVista .30s cubic-bezier(.2,.7,.2,1); }
    @keyframes entradaVista {
      from { opacity: 0; transform: translateX(26px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @media (min-width: 640px) {
      @keyframes entradaVista {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }
    @media (prefers-reduced-motion: reduce) { .vista-anim { animation: none; } }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen">
  <div id="app"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
